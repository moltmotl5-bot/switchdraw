<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SwitchDraw - 上傳解析</title>
  <link rel="stylesheet" href="css/app.css?v=1.2.0">
</head>
<body>
  <main>
    <header>
      <h1>上傳解析 <span class="version-badge">v1.2.0</span></h1>
      <p class="subtitle">上傳 PuTTY 擷取的 Cisco IOS / IOS-XE 設定日誌，產生 Excel 前面板埠位圖（.xlsx）。</p>
    </header>

    <p id="store-notice" class="store-notice"></p>

    <section class="panel">
      <div id="dropzone" class="dropzone">
        <strong>拖放 *.log 或 *.txt 到這裡</strong>
        <span class="muted">或點擊選擇檔案</span>
      </div>
      <input id="file-input" type="file" accept=".log,.txt">
      <div class="toolbar">
        <button id="download-btn" type="button" disabled>下載 Excel 埠位圖（.xlsx）</button>
      </div>
      <p id="status" class="status" hidden></p>
      <p id="error" hidden></p>
    </section>

    <section class="panel">
      <h2>解析摘要</h2>
      <div id="summary">
        <p class="muted">尚未上傳檔案。</p>
      </div>
    </section>

    <section class="panel">
      <h2>前面板預覽</h2>
      <div id="preview"></div>
    </section>

    <footer>
      SwitchDraw v1.2.0 — 輸出為標準 .xlsx（無 VBA 巨集、無公式、無外部連結）。解析在本機完成；透過 npm start 執行時，結果會寫入 data/switches/。
    </footer>
  </main>

  <script src="vendor/exceljs.bare.min.js?v=1.2.0"></script>
  <script src="js/parse.js?v=1.2.0"></script>
  <script src="js/faceplate.js?v=1.2.0"></script>
  <script src="js/workbook.js?v=1.2.0"></script>
  <script src="js/ui.js?v=1.2.0"></script>
  <script src="js/store-client.js?v=1.2.0"></script>
  <script src="js/layout.js?v=1.2.0"></script>
  <script src="js/app.js?v=1.2.0"></script>
</body>
</html>
